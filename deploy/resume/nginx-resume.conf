# ============================================================================
# 壹页简历 Nginx 站点配置（resume.xnkun.com → 127.0.0.1:3001）
#
# 与谷团宝（gutuanbao.xnkun.com）共存于同一台 2核2G ECS：
#   - 壹页简历:  resume.xnkun.com   → 127.0.0.1:3001 (PM2: yiyejianli)
#   - 谷团宝:    gutuanbao.xnkun.com → Nginx 静态 + 127.0.0.1:3000 (PM2: gutuanbao-api)
#
# 安装（首次）：
#   scp deploy/resume/nginx-resume.conf root@<服务器IP>:/etc/nginx/sites-available/resume.conf
#   ssh root@<服务器IP>
#   ln -s /etc/nginx/sites-available/resume.conf /etc/nginx/sites-enabled/resume.conf
#   nginx -t && systemctl reload nginx
#   sudo certbot --nginx -d resume.xnkun.com   # 自动注入 443 + 证书 + 80→443 跳转
#
# 说明：只写 80 块（含全部 proxy 配置），HTTPS 由 certbot --nginx 自动生成，
#       与谷团宝 init.sh 已验证的方式一致，避免手写证书路径导致 nginx -t 失败。
# ============================================================================

server {
    listen 80;
    server_name resume.xnkun.com;

    # certbot http-01 验证（nginx 插件自动处理，此块兜底无害）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 微信网页授权域名校验文件（MP_verify_*.txt），直接从 /var/www/html 服务
    location = /MP_verify_IL7V3zxs6dUAi6NY.txt {
        root /var/www/html;
    }

    # 静态资源长缓存（Vite 产物带 hash，可永久缓存）
    location /assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 管理后台（独立构建产物 dist/admin，由 Node 服务托管在 /admin）
    location /admin/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API（翻译/支付/订单/健康检查）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 前端 SPA（Node 服务兜底返回 index.html）
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
