# ============================================================================
# 壹页简历 管理后台 Nginx 站点配置（admin.resume.xnkun.com → 127.0.0.1:3001）
#
# 与主站 resume.xnkun.com 共用同一个 Node 服务（PM2: yiyejianli，端口 3001）：
#   - 主站:     resume.xnkun.com       → 3001（nginx-resume.conf）
#   - 管理后台: admin.resume.xnkun.com → 3001（本文件，独立子域名）
#
# 工作原理：
#   后台 SPA（dist/admin，base='/admin/'）与服务端 /api/admin 均由 3001 托管。
#   本文件把 admin 域名的请求按前缀映射到 3001 的对应子树，无需改任何代码：
#     /admin/*  → 3001 的 /admin/*（后台静态资源，base 已带 /admin 前缀）
#     /api/*    → 3001 的 /api/*（后台前端用相对路径 /api/admin/* 调接口）
#     /         → 3001 的 /admin/（后台首页；SPA 深链由 3001 的 /admin/* 兜底 index.html）
#
# 安装（首次）：
#   scp deploy/resume/admin-resume.conf root@<服务器IP>:/etc/nginx/sites-available/admin-resume.conf
#   ssh root@<服务器IP>
#   ln -s /etc/nginx/sites-available/admin-resume.conf /etc/nginx/sites-enabled/admin-resume.conf
#   nginx -t && systemctl reload nginx
#   sudo certbot --nginx -d admin.resume.xnkun.com   # 自动注入 443 + 证书 + 80→443 跳转
#
# 前置：域名 admin.resume.xnkun.com 需先解析到该服务器公网 IP（DNS A 记录）。
#
# 说明：只写 80 块（含全部 proxy 配置），HTTPS 由 certbot --nginx 自动生成，
#       与主站 nginx-resume.conf 已验证的方式一致，避免手写证书路径导致 nginx -t 失败。
# ============================================================================

server {
    listen 80;
    server_name admin.resume.xnkun.com;

    # certbot http-01 验证（nginx 插件自动处理，此块兜底无害）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 后台静态资源（base='/admin/'，资源 URL 带 /admin 前缀，直接透传 3001）
    location /admin/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后台 API（后台前端用相对路径 /api/admin/*，反代 3001）
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 后台首页 + SPA 深链：统一加 /admin 前缀转 3001，
    # 3001 的 /admin/*（express.static + 回退 index.html）负责返回 SPA 入口。
    # 注意：/admin/ 与 /api/ 为更精确前缀，优先命中上面两个 location，不会进到这里。
    location / {
        rewrite ^/(.*)$ /admin/$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
